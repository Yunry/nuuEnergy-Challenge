<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="A simple first check to understand whether a heat pump could work for your home, and what to check next.">
  <title>Heat pump home check · nuuEnergy</title>
  <link rel="stylesheet" href="/src/browser/styles.css">
  <script type="module" src="/src/browser/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="nuuEnergy home check home"><span>nuu</span>Energy<span class="brand-dot" aria-hidden="true">.</span></a>
    <span class="header-description">Your heat pump home check</span>
    <div class="view-switch" role="group" aria-label="View">
      <button type="button" data-mode="customer" aria-pressed="false">Customer</button>
      <button type="button" data-mode="both" aria-pressed="true">Customer + Dev</button>
      <button type="button" data-mode="developer" aria-pressed="false">Developer</button>
    </div>
    <button type="button" id="text-size" class="text-size" aria-pressed="false"><span aria-hidden="true">A<span class="big-a">A</span></span> Larger text</button>

  <div id="app"></div>
  <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <footer class="site-footer"><span>nuuEnergy · Hackathon prototype</span><span>No account needed. Completed checks are saved in this browser.</span></footer>
  <noscript><main><h1>Please enable JavaScript</h1><p>This home check needs JavaScript to work. No account is required.</p></main></noscript>

</html>
